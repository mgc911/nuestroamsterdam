<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nuestro Ámsterdam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: barra de capas arriba, mapa a pantalla completa debajo */
:root{--bg:#fbf3e4;--land:#fbf3e4;--dots:#ecdcc0;--wlabel:#ffffff;--panel:#ffffff;--fg:#14202b;--muted:#5b6b78;--line:#d6ddd6;
--water:#5bb6ea;--street:#ffffff;--streetcase:#e6d6b8;--motorway:#f2c66d;--park:#a9d98c;--route:#5b6b78;--ferryline:#e8445f;
--mine:#d8312f;--rest:#e0861a;--poi:#2a74ab;--roof:#8a4fbf;--coffee:#2e9a3f;--taxi:#f2c200;--market:#b5651d;--metro:#d6262d;--transit:#1d5fa8;--ferry:#0f8a8a;--train:#ffc917;--sans:Inter,system-ui,sans-serif;--disp:"Space Grotesk",Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b21;--land:#17212a;--dots:#22303b;--wlabel:#cfe8f7;--panel:#1c252e;--fg:#e7edf2;--muted:#9aabb8;--line:#2c3945;--water:#2a6a96;--street:#3a4855;--streetcase:#141b21;--motorway:#8a6a2a;--park:#22382a;--route:#8fa1af;--roof:#b98ae0;--coffee:#5cc46b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b21;--land:#17212a;--dots:#22303b;--wlabel:#cfe8f7;--panel:#1c252e;--fg:#e7edf2;--muted:#9aabb8;--line:#2c3945;--water:#2a6a96;--street:#3a4855;--streetcase:#141b21;--motorway:#8a6a2a;--park:#22382a;--route:#8fa1af;--roof:#b98ae0;--coffee:#5cc46b;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column;margin:0}
header{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

.brand{display:flex;align-items:center;gap:8px}
.logo{height:36px;width:auto;display:block;flex:none}
h1{font:700 18px/1.1 var(--disp);margin:0;letter-spacing:-.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px var(--sans);border:1.5px solid var(--c);color:var(--fg);background:transparent;border-radius:999px;padding:4px 9px 4px 7px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{opacity:.45}
.chip[aria-pressed=false] i{background:transparent;border:1.5px solid var(--c)}
.chip:focus-visible,.fit:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{position:relative;flex:1;display:flex;min-height:0}
#map{flex:1;min-height:0;background:var(--land)}
.leaflet-container{font-family:var(--sans)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:13px;line-height:1}
.pin.big{width:36px;height:36px}.pin.big span{font-size:18px}
.taxi{width:18px;height:18px;border-radius:4px;background:var(--taxi);color:#1a1a1a;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);font:800 11px/18px var(--sans);text-align:center}
.mkt{width:16px;height:16px;border-radius:50%;background:var(--market);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tr{min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--transit);color:#fff;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);font:800 9px/14px var(--sans);text-align:center;box-sizing:border-box;transform:translate(-50%,-50%);position:absolute;left:0;top:0;white-space:nowrap}
.tr.metro{background:var(--metro)}.tr.ferry{background:var(--ferry)}.tr.train{background:var(--train);color:#1a1a1a}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.leaflet-popup-content dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:13px}
.leaflet-popup-content dt{color:var(--muted);font-weight:600}
.leaflet-popup-content dd{margin:0}
.leaflet-popup-content{font:14px/1.45 var(--sans);margin:12px 14px;max-width:min(280px,70vw)}
.leaflet-popup-content b{font:700 15px var(--disp);display:block;margin-bottom:2px}
.leaflet-popup-content .t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.leaflet-popup-content a{display:inline-block;margin-top:6px;font-weight:600;color:var(--poi)}
.leaflet-tooltip{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:600 12px var(--sans)}
.lbl{box-shadow:0 1px 3px rgba(0,0,0,.3)}
.lbl:before{display:none}
.area{font:600 11px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;pointer-events:none;opacity:.8}
.area.barr{pointer-events:auto;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.area.barr:hover{color:var(--fg)}
.area.w{color:var(--poi);letter-spacing:.3em;font-size:12px}
.fit{position:absolute;z-index:500;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 13px var(--sans);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.note{position:absolute;z-index:500;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));max-width:min(260px,55%);background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.35}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-color:var(--line)}
.leaflet-control-scale-line{background:var(--panel);color:var(--fg);border-color:var(--fg)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)}
.slbl{pointer-events:none}
.slbl span{position:absolute;left:0;top:0;white-space:nowrap;font:600 11px/1 var(--sans);color:var(--fg);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land);transform:translate(-50%,-50%) rotate(var(--r))}
.slbl.cn span{font-style:italic;font-weight:500;color:var(--poi)}
.slbl.mw span{color:var(--muted);font-size:10px}

.layers-btn{display:none;margin-left:auto;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:3px 10px 3px 6px;font:600 13px var(--sans);cursor:pointer}
.layers-btn b{min-width:18px;height:18px;border-radius:9px;background:var(--mine);color:#fff;font:700 11px/18px var(--sans);text-align:center;padding:0 4px}
.layers-btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.bk{display:block;height:30px;width:auto;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.bk-w{animation:bkspin 2.4s linear infinite}
.bk-f{animation:bkbob 1.2s ease-in-out infinite}
.layers-btn[aria-expanded=true] .bk-w{animation-duration:.45s}
.layers-btn[aria-expanded=true] .bk{transform:rotate(-14deg) scale(1.12)}
.layers-btn[aria-expanded=true] .bk-bell{animation:bkring .4s ease-in-out 2}
.bk-tul{transform-origin:28px 12px;animation:bktul 2.4s ease-in-out infinite}
@keyframes bkspin{to{transform:rotate(360deg)}}
@keyframes bkbob{50%{transform:translateY(-.8px)}}
@keyframes bkride{0%{transform:translateX(-4px)}60%{transform:translateX(3px)}100%{transform:none}}
@keyframes bkring{50%{transform:rotate(25deg) translate(1px,-1px)}}
@keyframes bktul{50%{transform:rotate(-12deg)}}
@keyframes chipsdrop{from{opacity:0;transform:translateY(-8px) scaleY(.92)}to{opacity:1;transform:none}}
@media (max-width:640px){
  header{position:relative;flex-wrap:nowrap}
  .layers-btn{display:flex}
  .chips{position:absolute;top:100%;left:0;right:0;z-index:1001;background:var(--panel);padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);box-shadow:0 8px 18px rgba(0,0,0,.18);transform-origin:top}
  .chips:not(.open){display:none}
  .chips.open{animation:chipsdrop .28s cubic-bezier(.2,1.3,.4,1)}
  .chip{font-size:13px;padding:6px 11px 6px 9px}
}
@media (prefers-reduced-motion:reduce){.bk-w,.bk-f,.bk-tul,.bk,.bk-bell,.chips.open{animation:none!important}}

.leaflet-container{background-color:var(--land);background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:16px 16px}
.area.barr{pointer-events:auto;cursor:pointer;text-decoration:none!important;opacity:1;letter-spacing:0;text-transform:none}
.ban{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap;background:var(--bc);color:#fff;border-radius:8px;padding:3px 10px 4px;box-shadow:0 2px 0 rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.15);border:2px solid #fff;transition:transform .2s}
.ban b{font:600 13px/1.15 Fredoka,var(--disp)}
.ban small{font:600 8.5px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.area.barr:hover .ban{transform:translate(-50%,-50%) scale(1.06)}
.area.w{font:600 20px Fredoka,var(--disp)!important;letter-spacing:.35em!important;color:var(--wlabel)!important;opacity:.9}
.deco{pointer-events:none}
.deco svg{position:absolute;left:0;top:0;transform:translate(-50%,-50%);overflow:visible}
.boat{animation:bob 3s ease-in-out infinite}
.mill .blades{transform-origin:20px 16px;animation:spin 6s linear infinite}
@keyframes bob{50%{transform:translate(-50%,-56%) rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.compass{position:absolute;z-index:500;right:max(10px,env(safe-area-inset-right,0px));top:10px;width:54px;height:54px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.compass svg{width:54px;height:54px;display:block}
.compass .rose{transition:transform .25s ease-out;transform-origin:27px 27px}
.compass:focus-visible,.locate:focus-visible{outline:3px solid #2b7de9;outline-offset:2px}
.locate{position:absolute;z-index:500;right:max(10px,env(safe-area-inset-right,0px));top:72px;display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 10px 5px 7px;font:600 12px var(--sans);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.locate svg{width:16px;height:16px}
.locate.on{background:#2b7de9;color:#fff;border-color:#2b7de9}
.locate.busy svg{animation:spin 1.2s linear infinite}
.geo-toast{position:absolute;z-index:600;left:50%;bottom:64px;transform:translateX(-50%);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:13px var(--sans);width:max-content;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.me{pointer-events:none}
.me .cone{position:absolute;left:-30px;top:-30px;width:60px;height:60px;transition:transform .25s ease-out;transform-origin:30px 30px}
.me .dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#2b7de9;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,125,233,.35),0 2px 6px rgba(0,0,0,.3)}
.me .dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid #2b7de9;animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(.5);opacity:.8}to{transform:scale(1.4);opacity:0}}
@media (max-width:640px){.lowz .ban small{display:none}.lowz .ban{padding:2px 8px}.lowz .ban b{font-size:12px}}
@media (prefers-reduced-motion:reduce){.boat,.mill .blades,.me .dot::after,.locate.busy svg{animation:none}.compass .rose,.me .cone{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Nuestro Ámsterdam</h1></div>
  <button class="layers-btn" id="layers-btn" type="button" aria-expanded="false" aria-controls="chips" aria-label="Capas del mapa"><img class="bk" src="logo.svg" alt="" width="48" height="30"><b id="layers-count">1</b></button>
  <div class="chips" id="chips">
    <button class="chip" id="t-mine" style="--c:var(--mine)" aria-pressed="true"><i></i>Nuestros puntos</button>
    <button class="chip" id="t-rest" style="--c:var(--rest)" aria-pressed="false"><i></i>Restaurantes</button>
    <button class="chip" id="t-poi" style="--c:var(--poi)" aria-pressed="false"><i></i>Puntos de interés</button>
    <button class="chip" id="t-roof" style="--c:var(--roof)" aria-pressed="false"><i></i>Rooftops</button>
    <button class="chip" id="t-coffee" style="--c:var(--coffee)" aria-pressed="false"><i></i>Coffeeshops</button>
    <button class="chip" id="t-taxi" style="--c:var(--taxi)" aria-pressed="false"><i></i>Taxis</button>
    <button class="chip" id="t-market" style="--c:var(--market)" aria-pressed="false"><i></i>Mercadillos</button>
    <button class="chip" id="t-transit" style="--c:var(--transit)" aria-pressed="false"><i></i>Metro y tranvía</button>
  </div>
</header>
<div class="wrap"><div id="map"></div><button class="compass" id="compass" type="button" aria-label="Brújula: mostrar mi posición y orientación"><svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="24" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/><g class="rose" id="rose"><path d="M27 6l5 21h-10z" fill="#e8445f"/><path d="M27 48l-5-21h10z" fill="#2f4f6f"/><path d="M6 27l21-4v8zM48 27l-21 4v-8z" fill="#c9b99a"/><text x="27" y="5.5" text-anchor="middle" font-size="7" font-weight="700" fill="var(--fg)" font-family="Inter,sans-serif">N</text></g></svg></button><button class="locate" id="locate" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg><span>Dónde estoy</span></button>
<div class="note" id="note">Plano esquemático: agua, calles y barrios aproximados. Toca un punto y usa «Abrir en Google Maps» para llegar.</div>
<button class="fit" id="fit">Ver aeropuerto</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const D={"mine": [{"n": "Nuestra casa", "d": "Room Mate Aitana · IJdok 6", "lat": 52.3826, "lng": 4.892, "url": "https://maps.app.goo.gl/r9QzCNxs5MG6wou5A", "k": "home", "x": [["Dirección", "IJdok 6 (Room Mate Aitana)"], ["Transporte", "Centraal a 5-10 min a pie: metro, tranvías, trenes y ferris"]]}, {"n": "NDSM", "d": "Antiguo astillero en Amsterdam-Noord. Ferry gratis desde Centraal (línea F4/906, unos 15 min)", "lat": 52.4012, "lng": 4.8918, "url": "https://www.google.com/maps/search/?api=1&query=NDSM+Amsterdam", "k": "ndsm", "x": [["Dirección", "NDSM-plein, Amsterdam-Noord"], ["Cómo llegar", "Ferry F4 gratis desde Centraal, unos 15 min"], ["Cerca", "Pllek, STRAAT Museum, IJ-Hallen"]]}, {"n": "Museo del Queso", "d": "Amsterdam Cheese Museum · Prinsengracht 112", "lat": 52.3757, "lng": 4.8839, "url": "https://maps.app.goo.gl/2FncUJoiJqL2F29r5", "k": "cheese", "x": [["Dirección", "Prinsengracht 112"], ["Entrada", "Gratis, con degustación"], ["Cómo llegar", "Tranvía 13/17 Westermarkt, o 15 min a pie desde casa"]]}, {"n": "Aeropuerto", "d": "Schiphol (AMS). Tren directo a Centraal en unos 15 min", "lat": 52.3105, "lng": 4.7683, "url": "https://maps.app.goo.gl/55VQ3WsjsbqF7PMQ8", "k": "plane", "x": [["Tren", "A Centraal en unos 15 min, aprox. 6 €"], ["Taxi", "Unos 50-60 €, 20-30 min"], ["Pago", "Tarjeta contactless al entrar y salir del andén"]]}], "rest": [{"n": "Pllek", "d": "Restaurante y bar hecho con contenedores marítimos a orillas del IJ, al lado de NDSM. Cocina de temporada, mucho producto vegetal y una playa urbana delante. Ideal para comer o ver el atardecer después de visitar la zona. Precio medio.", "t": "NDSM", "lat": 52.4008, "lng": 4.8932, "url": "https://www.google.com/maps/search/?api=1&query=Pllek+Amsterdam", "x": [["Dirección", "TT. Neveritaweg 59, NDSM"], ["Precio", "€€"], ["Qué pedir", "Plato de temporada o pescado del día"], ["Reserva", "Recomendable para cenar en fin de semana"], ["Ideal para", "Ver el atardecer tras visitar NDSM"]]}, {"n": "Hotel de Goudfazant", "d": "Restaurante instalado en un antiguo taller de coches en Noord, con techos altísimos y ambiente industrial. Menú del día de inspiración francesa a precio razonable. Solo cenas; conviene reservar.", "t": "Francés", "lat": 52.3897, "lng": 4.9163, "url": "https://www.google.com/maps/search/?api=1&query=Hotel+de+Goudfazant+Amsterdam", "x": [["Dirección", "Aambeeldstraat 10H, Noord"], ["Precio", "€€€"], ["Qué pedir", "Menú del día de 3 platos"], ["Reserva", "Imprescindible"], ["Ideal para", "Cena especial sin formalidades"]]}, {"n": "De Ceuvel", "d": "Café sostenible construido sobre barcos reconvertidos en un antiguo astillero de Noord. Comida vegetariana sencilla, cervezas locales y terraza junto al agua. Buen plan informal para media tarde.", "t": "Café", "lat": 52.3913, "lng": 4.914, "url": "https://www.google.com/maps/search/?api=1&query=De+Ceuvel+Amsterdam", "x": [["Dirección", "Korte Papaverweg 4, Noord"], ["Precio", "€"], ["Qué pedir", "Hamburguesa vegetal y cerveza local"], ["Reserva", "No hace falta"], ["Ideal para", "Tarde tranquila junto al agua"]]}, {"n": "Hannekes Boom", "d": "Bar-restaurante de madera con una gran terraza sobre el agua, a pocos minutos a pie de la Estación Central y de NEMO. Muy animado con buen tiempo. Carta corta y precios moderados.", "t": "Café", "lat": 52.3786, "lng": 4.9128, "url": "https://www.google.com/maps/search/?api=1&query=Hannekes+Boom+Amsterdam", "x": [["Dirección", "Dijksgracht 4"], ["Precio", "€"], ["Qué pedir", "Hamburguesa, nachos y cerveza"], ["Reserva", "No se reserva"], ["Ideal para", "Terraza con ambiente, cerca de Centraal"]]}, {"n": "Sea Palace", "d": "Restaurante chino flotante de tres plantas en el Oosterdok, cerca de la Estación Central. Famoso por su dim sum y por las vistas al agua. Bueno para grupos.", "t": "Chino", "lat": 52.3757, "lng": 4.9055, "url": "https://www.google.com/maps/search/?api=1&query=Sea+Palace+Amsterdam", "x": [["Dirección", "Oosterdokskade 8"], ["Precio", "€€"], ["Qué pedir", "Dim sum y pato pekinés"], ["Reserva", "Recomendable en grupo"], ["Ideal para", "Comida china con vistas al agua"]]}, {"n": "The Pancake Bakery", "d": "Casa de tortitas holandesas (pannenkoeken) en un almacén del siglo XVII junto al Prinsengracht, a dos minutos del Museo del Queso. Hay versiones dulces y saladas. Suele haber cola a mediodía.", "t": "Holandés", "lat": 52.3767, "lng": 4.884, "url": "https://www.google.com/maps/search/?api=1&query=The+Pancake+Bakery+Amsterdam", "x": [["Dirección", "Prinsengracht 191"], ["Precio", "€"], ["Qué pedir", "Tortita de bacon y queso, o de manzana"], ["Reserva", "Admite reservas online"], ["Ideal para", "Comer rápido junto al Museo del Queso"]]}, {"n": "Winkel 43", "d": "Café de esquina en la plaza Noordermarkt, en el Jordaan, célebre por su tarta de manzana con nata. Perfecto para desayunar o merendar, sobre todo el lunes o sábado, días de mercado.", "t": "Café", "lat": 52.3802, "lng": 4.8863, "url": "https://www.google.com/maps/search/?api=1&query=Winkel+43+Amsterdam", "x": [["Dirección", "Noordermarkt 43"], ["Precio", "€"], ["Qué pedir", "Appeltaart met slagroom (tarta de manzana con nata)"], ["Reserva", "No se reserva"], ["Ideal para", "Desayuno o merienda en el Jordaan"]]}, {"n": "Moeders", "d": "\"Madres\" en neerlandés: las paredes están llenas de fotos de madres que han enviado los clientes. Cocina casera holandesa (stamppot, albóndigas, rijsttafel holandesa). Muy recomendable reservar.", "t": "Holandés", "lat": 52.3733, "lng": 4.8747, "url": "https://www.google.com/maps/search/?api=1&query=Moeders+Amsterdam", "x": [["Dirección", "Rozengracht 251"], ["Precio", "€€"], ["Qué pedir", "Stamppot y la rijsttafel holandesa"], ["Reserva", "Muy recomendable"], ["Ideal para", "Cena de cocina holandesa típica"]]}, {"n": "Breda", "d": "Restaurante moderno en el Singel con menú sorpresa de varios platos a precio cerrado. Cocina creativa y ambiente elegante pero relajado. Para una cena especial; reservar con antelación.", "t": "Moderno", "lat": 52.3729, "lng": 4.8889, "url": "https://www.google.com/maps/search/?api=1&query=Breda+Amsterdam", "x": [["Dirección", "Singel 210"], ["Precio", "€€€"], ["Qué pedir", "Menú sorpresa de varios platos"], ["Reserva", "Necesaria, con antelación"], ["Ideal para", "Cena especial"]]}, {"n": "The Seafood Bar", "d": "Marisquería luminosa junto a la plaza Spui. Ostras, fuentes de marisco, fish and chips y pescado a la plancha. Muy popular, así que mejor reservar o ir temprano.", "t": "Marisco", "lat": 52.3686, "lng": 4.8901, "url": "https://www.google.com/maps/search/?api=1&query=The+Seafood+Bar+Amsterdam", "x": [["Dirección", "Spui 15"], ["Precio", "€€€"], ["Qué pedir", "Fuente de marisco, ostras o fish and chips"], ["Reserva", "Recomendable"], ["Ideal para", "Marisco en el centro"]]}, {"n": "Café de Klos", "d": "Bar pequeño y bullicioso cerca de Leidseplein, famoso por sus costillas a la brasa en raciones enormes. No admite reservas para grupos pequeños: llega pronto o espera en la barra.", "t": "Carne", "lat": 52.3655, "lng": 4.8858, "url": "https://www.google.com/maps/search/?api=1&query=Café+de+Klos+Amsterdam", "x": [["Dirección", "Kerkstraat 41"], ["Precio", "€€"], ["Qué pedir", "Costillas (spareribs) a la brasa"], ["Reserva", "No para grupos pequeños: ve pronto"], ["Ideal para", "Cena contundente cerca de Leidseplein"]]}, {"n": "Foodhallen", "d": "Mercado gastronómico en un antiguo depósito de tranvías en Oud-West, con una veintena de puestos: bitterballen, tacos, dim sum, hamburguesas y más. Bueno cuando cada uno quiere algo distinto.", "t": "Food hall", "lat": 52.3668, "lng": 4.8686, "url": "https://www.google.com/maps/search/?api=1&query=Foodhallen+Amsterdam", "x": [["Dirección", "Bellamyplein 51, Oud-West"], ["Precio", "€-€€"], ["Qué pedir", "Bitterballen y algo de los puestos"], ["Reserva", "No se reserva"], ["Ideal para", "Cuando cada uno quiere algo distinto"]]}, {"n": "Restaurant Blauw", "d": "Uno de los restaurantes indonesios mejor valorados de la ciudad. Pide la rijsttafel, un festín de muchos platitos pequeños herencia de la época colonial. Imprescindible reservar.", "t": "Indonesio", "lat": 52.3541, "lng": 4.8579, "url": "https://www.google.com/maps/search/?api=1&query=Restaurant+Blauw+Amsterdam", "x": [["Dirección", "Amstelveenseweg 158"], ["Precio", "€€€"], ["Qué pedir", "Rijsttafel indonesia"], ["Reserva", "Imprescindible"], ["Ideal para", "Cena especial y diferente"]]}, {"n": "Bakers & Roasters", "d": "Brunch de inspiración neozelandesa y brasileña en De Pijp: huevos benedict, tostadas, bowls y buen café. Muy popular el fin de semana; no reserva, así que ve temprano.", "t": "Brunch", "lat": 52.357, "lng": 4.8886, "url": "https://www.google.com/maps/search/?api=1&query=Bakers+&+Roasters+Amsterdam", "x": [["Dirección", "Eerste Jacob van Campenstraat 54, De Pijp"], ["Precio", "€€"], ["Qué pedir", "Huevos benedict y banana bread"], ["Reserva", "No se reserva: ve temprano"], ["Ideal para", "Brunch"]]}, {"n": "Rijsel", "d": "Cocina francesa y flamenca en un antiguo colegio del este de la ciudad, con su famoso pollo asado al espetón. Ambiente informal y relación calidad-precio muy buena.", "t": "Francés", "lat": 52.3536, "lng": 4.9238, "url": "https://www.google.com/maps/search/?api=1&query=Rijsel+Amsterdam", "x": [["Dirección", "Marcusstraat 52, Oost"], ["Precio", "€€"], ["Qué pedir", "Pollo asado al espetón"], ["Reserva", "Recomendable"], ["Ideal para", "Cena con buena relación calidad-precio"]]}, {"n": "Ciel Bleu", "d": "Restaurante con dos estrellas Michelin en la planta 23 del Hotel Okura, con vistas panorámicas de la ciudad. Menús degustación de alta cocina. Para una ocasión especial, reserva con mucha antelación.", "t": "Alta cocina", "lat": 52.3497, "lng": 4.8932, "url": "https://www.google.com/maps/search/?api=1&query=Ciel+Bleu+Amsterdam", "x": [["Dirección", "Ferdinand Bolstraat 333 (Hotel Okura, planta 23)"], ["Precio", "€€€€"], ["Qué pedir", "Menú degustación"], ["Reserva", "Con semanas de antelación"], ["Ideal para", "Una ocasión muy especial"]]}], "poi": [{"n": "Rijksmuseum", "d": "El museo nacional de los Países Bajos, con La ronda de noche de Rembrandt y La lechera de Vermeer. Calcula al menos tres horas. El pasaje bajo el edificio se puede cruzar a pie o en bici sin entrada. Compra la entrada online.", "lat": 52.36, "lng": 4.8852, "url": "https://www.google.com/maps/search/?api=1&query=Rijksmuseum+Amsterdam", "x": [["Dirección", "Museumstraat 1"], ["Entrada (aprox.)", "25 €"], ["Tiempo de visita", "2-3 h"], ["Reserva", "Online recomendada"], ["Cómo llegar", "Tranvía 2/12, parada Rijksmuseum"]]}, {"n": "Museo Van Gogh", "d": "La mayor colección del mundo de Van Gogh: Los girasoles, Los comedores de patatas y muchas cartas y autorretratos. Las entradas son con hora y se agotan, así que resérvalas con días de antelación.", "lat": 52.3584, "lng": 4.8811, "url": "https://www.google.com/maps/search/?api=1&query=Museo+Van+Gogh+Amsterdam", "x": [["Dirección", "Museumplein 6"], ["Entrada (aprox.)", "22 €"], ["Tiempo de visita", "1,5-2 h"], ["Reserva", "Obligatoria, con hora"], ["Cómo llegar", "Tranvía 2/12, parada Van Baerlestraat"]]}, {"n": "Casa de Ana Frank", "d": "La casa del Prinsengracht donde Ana Frank y su familia se escondieron durante la ocupación nazi y donde escribió su diario. Visita muy emotiva. Las entradas se venden solo online, se liberan con unas seis semanas de antelación y vuelan.", "lat": 52.3752, "lng": 4.884, "url": "https://www.google.com/maps/search/?api=1&query=Casa+de+Ana+Frank+Amsterdam", "x": [["Dirección", "Westermarkt 20"], ["Entrada (aprox.)", "16 €"], ["Tiempo de visita", "1 h"], ["Reserva", "Solo online, salen 6 semanas antes"], ["Cómo llegar", "Tranvía 13/17, parada Westermarkt"]]}, {"n": "Plaza Dam y Palacio Real", "d": "La plaza central de la ciudad, con el Palacio Real (antiguo ayuntamiento del siglo XVII, visitable), la Nieuwe Kerk y el Monumento Nacional. Punto de partida natural para recorrer el centro.", "lat": 52.3731, "lng": 4.8913, "url": "https://www.google.com/maps/search/?api=1&query=Plaza+Dam+y+Palacio+Real+Amsterdam", "x": [["Dirección", "Dam"], ["Entrada (aprox.)", "Plaza gratis; Palacio unos 12 €"], ["Tiempo de visita", "1 h"], ["Reserva", "No hace falta"], ["Cómo llegar", "Tranvía hasta Dam o metro 52, Rokin"]]}, {"n": "Begijnhof", "d": "Patio tranquilo escondido tras una puerta junto a Spui, rodeado de casitas donde vivían las beguinas, mujeres religiosas laicas. Aquí está la casa de madera más antigua de la ciudad (Het Houten Huis). Visita breve y en silencio.", "lat": 52.3693, "lng": 4.8898, "url": "https://www.google.com/maps/search/?api=1&query=Begijnhof+Amsterdam", "x": [["Dirección", "Entrada por la plaza Spui"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "20-30 min"], ["Reserva", "No"], ["Cómo llegar", "Tranvía 2/12, parada Spui"]]}, {"n": "Las Nueve Calles", "d": "Nueve callejuelas que cruzan los canales Singel, Herengracht, Keizersgracht y Prinsengracht. Tiendas independientes, vintage, cafés y galerías. Ideal para pasear y comprar algo diferente.", "lat": 52.3704, "lng": 4.8848, "url": "https://www.google.com/maps/search/?api=1&query=Las+Nueve+Calles+Amsterdam", "x": [["Dirección", "Entre Singel y Prinsengracht"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "1-2 h"], ["Reserva", "No"], ["Cómo llegar", "Tranvía 13/17 Westermarkt o 2/12 Spui"]]}, {"n": "Jordaan", "d": "Antiguo barrio obrero convertido en el más encantador de la ciudad: canales estrechos, patios interiores, cafés marrones y galerías. Los sábados hay mercado en Noordermarkt y en Lindengracht.", "lat": 52.3775, "lng": 4.881, "url": "https://www.google.com/maps/search/?api=1&query=Jordaan+Amsterdam", "x": [["Dirección", "Al oeste del Prinsengracht"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "Medio día paseando"], ["Reserva", "No"], ["Cómo llegar", "A pie desde casa, unos 15 min"]]}, {"n": "Westerkerk", "d": "Iglesia protestante del siglo XVII junto a la Casa de Ana Frank, con la torre más alta del centro (85 m). Se puede subir en visita guiada para ver los canales desde arriba. Rembrandt está enterrado aquí.", "lat": 52.3747, "lng": 4.884, "url": "https://www.google.com/maps/search/?api=1&query=Westerkerk+Amsterdam", "x": [["Dirección", "Prinsengracht 279"], ["Entrada (aprox.)", "Iglesia gratis; torre unos 10 €"], ["Tiempo de visita", "45 min"], ["Reserva", "Torre con hora, online"], ["Cómo llegar", "Tranvía 13/17, parada Westermarkt"]]}, {"n": "Bloemenmarkt", "d": "Mercado de flores sobre barcazas en el canal Singel. Bulbos de tulipán, semillas y recuerdos. Más turístico que auténtico, pero vistoso y de paso entre Muntplein y Koningsplein.", "lat": 52.3667, "lng": 4.8919, "url": "https://www.google.com/maps/search/?api=1&query=Bloemenmarkt+Amsterdam", "x": [["Dirección", "Singel, entre Muntplein y Koningsplein"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "30 min"], ["Reserva", "No"], ["Cómo llegar", "Tranvía 4/14/24, parada Muntplein"]]}, {"n": "Vondelpark", "d": "El parque más grande y popular de la ciudad, con estanques, rosaleda y varias terrazas. Perfecto para descansar entre museos; el teatro al aire libre programa actividades en verano.", "lat": 52.358, "lng": 4.8686, "url": "https://www.google.com/maps/search/?api=1&query=Vondelpark+Amsterdam", "x": [["Dirección", "Entrada principal junto a Leidseplein"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "1-2 h"], ["Reserva", "No"], ["Cómo llegar", "Tranvía hasta Leidseplein o Van Baerlestraat"]]}, {"n": "Mercado Albert Cuyp", "d": "El mercado callejero más grande de los Países Bajos, en De Pijp, abierto de lunes a sábado. Prueba un stroopwafel recién hecho, arenque o poffertjes. Las calles de alrededor están llenas de cafés.", "lat": 52.3556, "lng": 4.8946, "url": "https://www.google.com/maps/search/?api=1&query=Mercado+Albert+Cuyp+Amsterdam", "x": [["Dirección", "Albert Cuypstraat"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "1 h"], ["Reserva", "No"], ["Cómo llegar", "Metro 52, De Pijp"]]}, {"n": "Heineken Experience", "d": "Recorrido interactivo por la antigua fábrica de Heineken, con historia de la marca y degustación al final. Más un espectáculo de marca que una visita técnica. Compra la entrada online, sale más barata.", "lat": 52.3578, "lng": 4.8918, "url": "https://www.google.com/maps/search/?api=1&query=Heineken+Experience+Amsterdam", "x": [["Dirección", "Stadhouderskade 78"], ["Entrada (aprox.)", "23 € (más barato online)"], ["Tiempo de visita", "1,5 h"], ["Reserva", "Online recomendada"], ["Cómo llegar", "Metro 52, Vijzelgracht"]]}, {"n": "Magere Brug", "d": "El \"puente flaco\", un puente levadizo blanco de madera sobre el Amstel. Muy fotogénico, sobre todo de noche, cuando lo iluminan cientos de bombillas.", "lat": 52.3634, "lng": 4.902, "url": "https://www.google.com/maps/search/?api=1&query=Magere+Brug+Amsterdam", "x": [["Dirección", "Sobre el Amstel, a la altura de Kerkstraat"], ["Entrada (aprox.)", "Gratis"], ["Tiempo de visita", "15 min"], ["Reserva", "No"], ["Cómo llegar", "Metro 51/53/54, Weesperplein"]]}, {"n": "Casa de Rembrandt", "d": "La casa donde Rembrandt vivió y trabajó durante casi veinte años, reconstruida con muebles de época, su taller y su colección de grabados. Hay demostraciones de grabado y preparación de pinturas.", "lat": 52.3694, "lng": 4.9012, "url": "https://www.google.com/maps/search/?api=1&query=Casa+de+Rembrandt+Amsterdam", "x": [["Dirección", "Jodenbreestraat 4"], ["Entrada (aprox.)", "20 €"], ["Tiempo de visita", "1-1,5 h"], ["Reserva", "Online recomendada"], ["Cómo llegar", "Metro 51/53/54, Waterlooplein"]]}, {"n": "Hortus Botanicus", "d": "Uno de los jardines botánicos más antiguos del mundo (1638), con invernaderos tropicales y de mariposas. Un rincón tranquilo en Plantage, cerca del zoo Artis.", "lat": 52.3667, "lng": 4.9081, "url": "https://www.google.com/maps/search/?api=1&query=Hortus+Botanicus+Amsterdam", "x": [["Dirección", "Plantage Middenlaan 2a"], ["Entrada (aprox.)", "13 €"], ["Tiempo de visita", "1 h"], ["Reserva", "No hace falta"], ["Cómo llegar", "Metro Waterlooplein o tranvía 14"]]}, {"n": "NEMO", "d": "Museo de ciencia interactivo con forma de proa de barco, diseñado por Renzo Piano. Muy enfocado a familias. Su azotea escalonada es un mirador gratuito con vistas sobre el puerto y el centro.", "lat": 52.3741, "lng": 4.9123, "url": "https://www.google.com/maps/search/?api=1&query=NEMO+Amsterdam", "x": [["Dirección", "Oosterdok 2"], ["Entrada (aprox.)", "Museo 18 €; azotea gratis"], ["Tiempo de visita", "Museo 2-3 h; azotea 20 min"], ["Reserva", "Museo online recomendada"], ["Cómo llegar", "10-15 min a pie desde Centraal"]]}, {"n": "Barrio Rojo y Oude Kerk", "d": "De Wallen, el barrio más antiguo de la ciudad, famoso por sus escaparates rojos. En su centro está la Oude Kerk (siglo XIII), el edificio más antiguo de Ámsterdam. Está prohibido hacer fotos a las trabajadoras.", "lat": 52.3743, "lng": 4.8983, "url": "https://www.google.com/maps/search/?api=1&query=Barrio+Rojo+y+Oude+Kerk+Amsterdam", "x": [["Dirección", "Oudekerksplein 23"], ["Entrada (aprox.)", "Barrio gratis; Oude Kerk unos 13 €"], ["Tiempo de visita", "1 h"], ["Reserva", "No"], ["Cómo llegar", "5 min a pie desde Centraal; metro Nieuwmarkt"]]}, {"n": "Estación Central", "d": "Estación neogótica de 1889, obra del mismo arquitecto que el Rijksmuseum. Trenes a Schiphol y a toda Holanda, tranvías y metro. Por detrás salen los ferris gratuitos a Noord y a NDSM.", "lat": 52.3791, "lng": 4.9003, "url": "https://www.google.com/maps/search/?api=1&query=Estación+Central+Amsterdam", "x": [["Dirección", "Stationsplein"], ["Cómo llegar", "5-10 min a pie desde casa"]]}, {"n": "EYE Filmmuseum", "d": "Museo del cine en un edificio blanco futurista al otro lado del IJ, a cinco minutos en ferry gratis desde Central. Exposiciones, cine de autor y una terraza con vistas al agua.", "lat": 52.3843, "lng": 4.9006, "url": "https://www.google.com/maps/search/?api=1&query=EYE+Filmmuseum+Amsterdam", "x": [["Dirección", "IJpromenade 1, Noord"], ["Entrada (aprox.)", "Edificio gratis; exposiciones unos 16 €"], ["Tiempo de visita", "1-2 h"], ["Reserva", "No hace falta"], ["Cómo llegar", "Ferry F3 gratis desde Centraal (5 min)"]]}, {"n": "A'DAM Lookout", "d": "Mirador en lo alto de la torre A'DAM, con vistas de 360 grados y el columpio \"Over the Edge\" suspendido sobre el vacío. Hay bar y restaurante giratorio. Se llega con el ferry gratis desde Central.", "lat": 52.3841, "lng": 4.9024, "url": "https://www.google.com/maps/search/?api=1&query=ADAM+Lookout+Amsterdam", "x": [["Dirección", "Overhoeksplein 5, Noord"], ["Entrada (aprox.)", "16-20 €; columpio aparte"], ["Tiempo de visita", "1 h"], ["Reserva", "Online, más barato"], ["Cómo llegar", "Ferry F3 gratis desde Centraal"]]}, {"n": "STRAAT Museum", "d": "Museo de arte urbano dentro de una enorme nave del antiguo astillero NDSM, con murales e instalaciones de artistas de todo el mundo. Encaja perfecto con vuestra visita a NDSM.", "lat": 52.4013, "lng": 4.8952, "url": "https://www.google.com/maps/search/?api=1&query=STRAAT+Museum+Amsterdam", "x": [["Dirección", "NDSM-plein 1, Noord"], ["Entrada (aprox.)", "20 €"], ["Tiempo de visita", "1,5 h"], ["Reserva", "Online recomendada"], ["Cómo llegar", "Ferry F4 gratis a NDSM"]]}], "roof": [{"n": "SkyLounge", "d": "Bar en la planta 11 del hotel DoubleTree, junto a la Estación Central, con terraza al aire libre y vistas de 360 grados sobre el IJ y el centro. Uno de los rooftops más grandes de la ciudad y muy cerca de vuestro alojamiento. Buen sitio para un cóctel al atardecer.", "t": "Cócteles", "lat": 52.3769, "lng": 4.9067, "url": "https://www.google.com/maps/search/?api=1&query=SkyLounge+Amsterdam", "x": [["Dirección", "Oosterdoksstraat 4 (DoubleTree)"], ["Altura", "Planta 11"], ["Precio", "€€€"], ["Qué pedir", "Cóctel de autor"], ["Ideal para", "El atardecer, a 10 min de casa"]]}, {"n": "W Lounge", "d": "Terraza en la azotea del Hotel W, en un antiguo edificio de telefónica junto a la plaza Dam. Vistas sobre los tejados del centro y ambiente elegante con DJ algunos días. Precios altos; código de vestimenta arreglado-informal.", "t": "Cócteles", "lat": 52.3735, "lng": 4.8905, "url": "https://www.google.com/maps/search/?api=1&query=W+Lounge+Amsterdam", "x": [["Dirección", "Spuistraat 175 (Hotel W)"], ["Altura", "Azotea"], ["Precio", "€€€"], ["Qué pedir", "Cócteles"], ["Ideal para", "Una copa elegante en el centro"]]}, {"n": "Canvas", "d": "Bar-restaurante en la séptima planta del Volkshotel, antigua sede de un periódico. Ambiente joven y creativo, con vistas al este de la ciudad y música por la noche. Más informal y económico que los rooftops de hotel de lujo.", "t": "Bar-restaurante", "lat": 52.354, "lng": 4.9125, "url": "https://www.google.com/maps/search/?api=1&query=Canvas+Amsterdam", "x": [["Dirección", "Wibautstraat 150 (Volkshotel)"], ["Altura", "Planta 7"], ["Precio", "€€"], ["Qué pedir", "Cerveza, cóctel o cena informal"], ["Ideal para", "Noche animada"]]}, {"n": "Zoku Loft", "d": "Azotea del hotel Zoku, con un jardín-invernadero y terraza. Ambiente relajado de salón compartido, bueno para un café, un brunch o unas copas. Cerca de Plantage y del Hortus Botanicus.", "t": "Bar-restaurante", "lat": 52.3622, "lng": 4.9068, "url": "https://www.google.com/maps/search/?api=1&query=Zoku+Loft+Amsterdam", "x": [["Dirección", "Weesperstraat 105 (Zoku)"], ["Altura", "Azotea"], ["Precio", "€€"], ["Qué pedir", "Café, brunch o una copa"], ["Ideal para", "Tarde tranquila"]]}, {"n": "Blue Amsterdam", "d": "Café acristalado y circular encima del centro comercial Kalverpassage, en plena zona de compras. Ofrece una de las mejores vistas panorámicas del centro histórico por el precio de un café. Solo abre en horario comercial.", "t": "Café", "lat": 52.3685, "lng": 4.8915, "url": "https://www.google.com/maps/search/?api=1&query=Blue+Amsterdam+Amsterdam", "x": [["Dirección", "Kalverpassage, último piso (Singel 457)"], ["Altura", "Última planta"], ["Precio", "€"], ["Qué pedir", "Café y tarta"], ["Ideal para", "Vistas del centro por poco dinero"]]}, {"n": "Terraza de la OBA", "d": "La biblioteca pública central tiene en su última planta un restaurante con terraza y vistas sobre el Oosterdok y la ciudad. Entrada libre y precios de cafetería: un rooftop sin pretensiones a 5 minutos de Centraal.", "t": "Café", "lat": 52.3757, "lng": 4.9083, "url": "https://www.google.com/maps/search/?api=1&query=Terraza+de+la+OBA+Amsterdam", "x": [["Dirección", "Oosterdokskade 143 (biblioteca)"], ["Altura", "Planta 7"], ["Precio", "€"], ["Qué pedir", "Café o almuerzo"], ["Ideal para", "Vistas gratis cerca de Centraal"]]}, {"n": "Twenty Third Bar", "d": "Bar de cócteles en la planta 23 del Hotel Okura, junto al restaurante Ciel Bleu. Vistas espectaculares sobre el sur de la ciudad y cócteles de autor. Ambiente elegante; ideal para una copa antes o después de cenar en De Pijp.", "t": "Cócteles", "lat": 52.35, "lng": 4.8937, "url": "https://www.google.com/maps/search/?api=1&query=Twenty+Third+Bar+Amsterdam", "x": [["Dirección", "Ferdinand Bolstraat 333 (Hotel Okura)"], ["Altura", "Planta 23"], ["Precio", "€€€€"], ["Qué pedir", "Cóctel de autor"], ["Ideal para", "Copa especial antes o después de cenar"]]}, {"n": "Madam", "d": "Restaurante y bar en lo alto de la A'DAM Tower, al otro lado del IJ, justo bajo el mirador A'DAM Lookout. Vistas sobre el puerto y el centro mientras cenas o tomas algo. Se llega con el ferry gratis desde Centraal.", "t": "Bar-restaurante", "lat": 52.3844, "lng": 4.9031, "url": "https://www.google.com/maps/search/?api=1&query=Madam+Amsterdam", "x": [["Dirección", "Overhoeksplein 1 (A'DAM Tower)"], ["Altura", "Planta 20"], ["Precio", "€€€"], ["Qué pedir", "Cena o copa"], ["Ideal para", "Vistas sobre el IJ"]]}], "coffee": [{"n": "The Bulldog", "d": "El primer coffeeshop de Ámsterdam (1975), en una antigua comisaría junto al canal de De Wallen. Más icono turístico que sitio para expertos, pero con historia. Ojo: en esta zona está prohibido fumar cannabis en la calle.", "t": "Clásico", "lat": 52.3728, "lng": 4.8985, "url": "https://www.google.com/maps/search/?api=1&query=The+Bulldog+Amsterdam", "x": [["Dirección", "Oudezijds Voorburgwal 90"], ["Ambiente", "Turístico e histórico"], ["Además", "Bar y tienda de recuerdos"], ["Ideal para", "La visita icónica"]]}, {"n": "Barney's", "d": "En la animada Haarlemmerstraat, a unos 10 minutos a pie de vuestra casa. Con muchos premios de la Cannabis Cup, tiene también un café-desayunador al lado. Suele estar lleno por la tarde.", "t": "Premiado", "lat": 52.3804, "lng": 4.8895, "url": "https://www.google.com/maps/search/?api=1&query=Barneys+Amsterdam", "x": [["Dirección", "Haarlemmerstraat 102"], ["Ambiente", "Animado"], ["Además", "Café de desayunos al lado"], ["Ideal para", "Calidad premiada, cerca de casa"]]}, {"n": "Grey Area", "d": "Local diminuto entre las Nueve Calles, con fama de tener de los mejores productos de la ciudad y personal que asesora bien. Hay poco sitio para sentarse, así que conviene ir a primera hora.", "t": "Pequeño", "lat": 52.3746, "lng": 4.8878, "url": "https://www.google.com/maps/search/?api=1&query=Grey+Area+Amsterdam", "x": [["Dirección", "Oude Leliestraat 2"], ["Ambiente", "Diminuto, sin pretensiones"], ["Además", "Personal que asesora"], ["Ideal para", "Probar de lo mejor de la ciudad"]]}, {"n": "Paradox", "d": "Coffeeshop pequeño y luminoso en el Jordaan, con ambiente de barrio y zumos y batidos naturales. Buena opción si buscas algo tranquilo y poco turístico.", "t": "Tranquilo", "lat": 52.374, "lng": 4.8815, "url": "https://www.google.com/maps/search/?api=1&query=Paradox+Amsterdam", "x": [["Dirección", "Eerste Bloemdwarsstraat 2"], ["Ambiente", "Tranquilo y luminoso"], ["Además", "Zumos y batidos naturales"], ["Ideal para", "Ambiente local en el Jordaan"]]}, {"n": "Dampkring", "d": "Clásico cerca de Spui, con interior psicodélico de madera tallada. Salió en la película Ocean's Twelve. Carta amplia y personal que explica bien las opciones.", "t": "Clásico", "lat": 52.3684, "lng": 4.8898, "url": "https://www.google.com/maps/search/?api=1&query=Dampkring+Amsterdam", "x": [["Dirección", "Handboogstraat 29"], ["Ambiente", "Psicodélico, de madera tallada"], ["Además", "Carta amplia"], ["Ideal para", "Un clásico junto a Spui"]]}, {"n": "Boerejongens", "d": "Decoración de barbería de los años 20 y camareros con chaleco: uno de los coffeeshops más cuidados de la ciudad. Muy bien valorado por la calidad. Está en la Utrechtsestraat, cerca de Rembrandtplein.", "t": "Premiado", "lat": 52.3646, "lng": 4.8977, "url": "https://www.google.com/maps/search/?api=1&query=Boerejongens+Amsterdam", "x": [["Dirección", "Utrechtsestraat 21"], ["Ambiente", "Barbería años 20, muy cuidado"], ["Además", "Atención personalizada"], ["Ideal para", "Calidad"]]}, {"n": "Abraxas", "d": "Junto a la plaza Dam, con varias plantas comunicadas por escaleras de caracol y una decoración de inspiración mística. Muy céntrico y popular; puede haber mucha gente.", "t": "Ambiente", "lat": 52.372, "lng": 4.8915, "url": "https://www.google.com/maps/search/?api=1&query=Abraxas+Amsterdam", "x": [["Dirección", "Jonge Roelensteeg 12-14"], ["Ambiente", "Varias plantas, decoración mística"], ["Además", "Zumos y cafés"], ["Ideal para", "Junto a Dam"]]}, {"n": "Siberië", "d": "Coffeeshop con aire de café de barrio junto al Brouwersgracht, uno de los canales más bonitos. Ambiente relajado, buen café y juegos de mesa. Cerca de vuestra casa.", "t": "Tranquilo", "lat": 52.3807, "lng": 4.89, "url": "https://www.google.com/maps/search/?api=1&query=Siberië+Amsterdam", "x": [["Dirección", "Brouwersgracht 11"], ["Ambiente", "Café de barrio"], ["Además", "Juegos de mesa y buen café"], ["Ideal para", "Relajarse cerca de casa"]]}], "taxi": [{"n": "Taxi Centraal Station", "d": "La parada de taxis más grande y la más cercana a vuestra casa (unos 5-10 minutos a pie). Está en el lado del IJ, detrás de la estación, no en la plaza principal. Hay fila organizada a cualquier hora.", "t": "Parada principal", "lat": 52.381, "lng": 4.9002, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Centraal+Station+Amsterdam", "x": [["Ubicación", "Parada principal, en el lado del IJ (detrás de la estación)"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Pide una estimación del precio antes de subir"]]}, {"n": "Taxi Dam", "d": "Parada oficial en pleno centro, junto a la plaza Dam. Útil para volver a casa después de recorrer el centro o las Nueve Calles.", "t": "Parada", "lat": 52.373, "lng": 4.8925, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Dam+Amsterdam", "x": [["Ubicación", "Junto a la plaza Dam"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Pide una estimación del precio antes de subir"]]}, {"n": "Taxi Leidseplein", "d": "Parada en una de las zonas de ocio más animadas. Por la noche, sobre todo los fines de semana, puede haber cola; úsala en lugar de buscar taxi en la calle.", "t": "Parada", "lat": 52.364, "lng": 4.8815, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Leidseplein+Amsterdam", "x": [["Ubicación", "Junto a Leidseplein, lado Marnixstraat"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Pide una estimación del precio antes de subir"]]}, {"n": "Taxi Rembrandtplein", "d": "Parada en la plaza de bares y discotecas. Muy práctica de madrugada, aunque las noches de fin de semana se forma fila.", "t": "Parada", "lat": 52.3663, "lng": 4.897, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Rembrandtplein+Amsterdam", "x": [["Ubicación", "En la plaza, zona de ocio nocturno"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Pide una estimación del precio antes de subir"]]}, {"n": "Taxi Westermarkt", "d": "Parada junto a la Westerkerk, a pocos pasos de la Casa de Ana Frank y del Museo del Queso. Cómoda para la zona del Jordaan.", "t": "Parada", "lat": 52.3749, "lng": 4.8836, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Westermarkt+Amsterdam", "x": [["Ubicación", "Junto a la Westerkerk y Ana Frank"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Pide una estimación del precio antes de subir"]]}, {"n": "Taxi Museumplein", "d": "Parada en la Van Baerlestraat, junto al Concertgebouw y a pocos minutos del Rijksmuseum y del Museo Van Gogh.", "t": "Parada", "lat": 52.357, "lng": 4.879, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Museumplein+Amsterdam", "x": [["Ubicación", "Van Baerlestraat, junto al Concertgebouw"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Pide una estimación del precio antes de subir"]]}, {"n": "Taxi Schiphol", "d": "Parada oficial a la salida de Schiphol Plaza. Coge solo taxis de la fila oficial. Al centro cuesta unos 50-60 € y tarda 20-30 min; el tren a Centraal es más rápido y barato.", "t": "Aeropuerto", "lat": 52.3092, "lng": 4.7628, "url": "https://www.google.com/maps/search/?api=1&query=taxi+standplaats+Schiphol+Amsterdam", "x": [["Ubicación", "Salida de Schiphol Plaza, parada oficial"], ["Pago", "Tarjeta o efectivo; los taxis oficiales llevan matrícula azul"], ["Consejo", "Al centro unos 50-60 €; el tren a Centraal (~6 €) es más rápido"]]}], "market": [{"n": "Noordermarkt", "t": "Sáb 9-16 · Lun 9-13", "lat": 52.3797, "lng": 4.8862, "d": "Dos mercados distintos junto a la Noorderkerk. El sábado (aprox. 9:00-16:00) es el Boerenmarkt, mercado ecológico de productores con quesos, pan y setas. El lunes por la mañana (aprox. 9:00-13:00) hay mercadillo de ropa vintage, telas y objetos de segunda mano, que sigue por la Westerstraat. Al lado está Winkel 43, la de la tarta de manzana.", "url": "https://www.google.com/maps/search/?api=1&query=Noordermarkt+Amsterdam", "x": [["Dirección", "Noordermarkt, junto a la Noorderkerk"], ["Días y horario", "Sáb 9-16 (ecológico) · Lun 9-13 (vintage)"], ["Qué comprar", "Queso, pan, setas; ropa y telas el lunes"], ["Cómo llegar", "A pie desde casa, unos 15 min"]]}, {"n": "Lindengracht", "t": "Sáb 9-16", "lat": 52.38, "lng": 4.881, "d": "Mercado de barrio del Jordaan, solo los sábados (aprox. 9:00-16:00). Fruta, flores, quesos, pescado y ropa, con ambiente muy local. Se combina bien con el Noordermarkt, a 5 minutos andando.", "url": "https://www.google.com/maps/search/?api=1&query=Lindengracht+Amsterdam", "x": [["Dirección", "Lindengracht"], ["Días y horario", "Sáb 9-16"], ["Qué comprar", "Fruta, flores, queso, pescado, ropa"], ["Cómo llegar", "A pie desde casa, unos 15 min"]]}, {"n": "Albert Cuypmarkt", "t": "Lun-Sáb 9-17", "lat": 52.3557, "lng": 4.893, "d": "El mercado callejero más grande del país, en De Pijp, de lunes a sábado (aprox. 9:00-17:00). Unos 250 puestos de comida, ropa y recuerdos. Prueba el stroopwafel recién hecho, el arenque o los poffertjes. Cerrado los domingos.", "url": "https://www.google.com/maps/search/?api=1&query=Albert+Cuypmarkt+Amsterdam", "x": [["Dirección", "Albert Cuypstraat, De Pijp"], ["Días y horario", "Lun-Sáb 9-17"], ["Qué comprar", "Stroopwafel, arenque, poffertjes, ropa"], ["Cómo llegar", "Metro 52, De Pijp"]]}, {"n": "Waterlooplein", "t": "Lun-Sáb 9:30-18", "lat": 52.3675, "lng": 4.9025, "d": "Mercadillo de pulgas al aire libre más antiguo de la ciudad, junto a la Casa de Rembrandt, de lunes a sábado (aprox. 9:30-18:00). Ropa vintage, discos, bicis, curiosidades y recuerdos. Cerrado los domingos.", "url": "https://www.google.com/maps/search/?api=1&query=Waterlooplein+Amsterdam", "x": [["Dirección", "Waterlooplein"], ["Días y horario", "Lun-Sáb 9:30-18"], ["Qué comprar", "Vintage, discos, curiosidades"], ["Cómo llegar", "Metro 51/53/54, Waterlooplein"]]}, {"n": "Bloemenmarkt", "t": "Todos los días", "lat": function segOf(p){let best=[p[0],p[1]],bl=-1;for(let k=0;k<p.length-1;k++){const d=Math.hypot(p[k+1][0]-p[k][0],p[k+1][1]-p[k][1]);if(d>bl){bl=d;best=[p[k],p[k+1]];}}return best;}
function addLbl(n,a,b,cls){const A=map.latLngToLayerPoint(a),Bp=map.latLngToLayerPoint(b);let ang=Math.atan2(Bp.y-A.y,Bp.x-A.x)*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  L.marker(mid,{interactive:false,keyboard:false,icon:L.divIcon({className:'slbl '+cls,iconSize:[0,0],html:`<span style="--r:${ang.toFixed(1)}deg">${n}</span>`})}).addTo(lbls);}

    if(s.r===1&&z>=13||s.r===2&&z>=14||s.r===3&&z>=15){const [a,b]=segOf(s.p);addLbl(s.n,a,b,'');}});
  if(z>=13.5)B.canalLines.forEach(c=>{const p=c.p,k=Math.floor((p.length-1)*0.45);addLbl(c.n,p[k],p[k+1],'cn');});}

 let me=null,acc=null,watch=null,head=null,first=true,toastT;
 const toast=m=>{let t=wrap.querySelector('.geo-toast');if(!t){t=document.createElement('div');t.className='geo-toast';t.setAttribute('role','status');wrap.appendChild(t);}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),5000);};
 const icon=()=>L.divIcon({className:'me',iconSize:[0,0],html:'<svg class="cone" viewBox="0 0 60 60" style="display:none"><defs><radialGradient id="cg" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="#2b7de9" stop-opacity=".8"/><stop offset="1" stop-color="#2b7de9" stop-opacity=".08"/></radialGradient></defs><path d="M30 30L14 4a30 30 0 0 1 32 0z" fill="url(#cg)"/></svg><span class="dot"></span>'});
 const applyHead=()=>{if(head==null)return;rose.style.transform=`rotate(${-head}deg)`;const c=me&&me.getElement()&&me.getElement().querySelector('.cone');if(c){c.style.display='block';c.style.transform=`rotate(${head}deg)`;}};
 const onOri=e=>{let h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=360-e.alpha;if(h==null)return;const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;head=(h+so+360)%360;applyHead();};
 const startOri=async()=>{addEventListener('ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation',onOri);
   try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')toast('Sin permiso de orientación: verás dónde estás, pero no hacia dónde miras.');}}catch(e){}};
 const stop=()=>{if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;if(me)me.remove();if(acc)acc.remove();me=acc=null;head=null;rose.style.transform='';removeEventListener('deviceorientationabsolute',onOri);removeEventListener('deviceorientation',onOri);lbtn.classList.remove('on','busy');lbl.textContent='Dónde estoy';};
 const start=()=>{if(!navigator.geolocation){toast('Este navegador no permite obtener tu ubicación.');return;}
   startOri();first=true;lbtn.classList.add('busy');lbl.textContent='Buscando…';
   watch=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];lbtn.classList.remove('busy');lbtn.classList.add('on');lbl.textContent='Siguiéndote';
     if(!me){me=L.marker(ll,{icon:icon(),interactive:false,keyboard:false,zIndexOffset:2000}).addTo(map);acc=L.circle(ll,{radius:p.coords.accuracy,color:'#2b7de9',weight:1,fillOpacity:.1,interactive:false}).addTo(map);}else{me.setLatLng(ll);acc.setLatLng(ll).setRadius(p.coords.accuracy);}
     if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>1)head=p.coords.heading;applyHead();
     if(first){first=false;map.setView(ll,Math.max(map.getZoom(),15));}},
    e=>{stop();toast(e.code===1?'No has dado permiso de ubicación. Actívalo en los ajustes del navegador y vuelve a probar.':'No se pudo obtener tu ubicación ahora mismo.');},
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});};
 lbtn.onclick=()=>{if(watch==null)return start();if(me&&!map.getBounds().contains(me.getLatLng()))return map.setView(me.getLatLng(),Math.max(map.getZoom(),15));stop();};
 cbtn.onclick=()=>{if(watch==null)start();else if(me)map.setView(me.getLatLng(),Math.max(map.getZoom(),15));};}
{const z=()=>document.getElementById('map').classList.toggle('lowz',map.getZoom()<14);map.on('zoomend',z);z();}
</script>

</body>
